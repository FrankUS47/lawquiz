s":[{"paragraph_number":"第1項","summary":"前條規定於在中華民國領域外對於中華民國人民犯罪之外"}]},{"article_number":"第9條","summary":"外國裁判之效力","paragraphs":[{"paragraph_number":"第1項","summary":"同一行為雖經外國確定裁判仍得依本法處斷但在外國已受"}]},{"article_number":"第10條","summary":"專用名詞之定義","paragraphs":[{"paragraph_number":"第1項","summary":"稱以上、以下、以內者，俱連本數或本刑計算。"},{"paragraph_number":"第2項","summary":"稱公務員者謂依法令服務於國家地方自治團體所屬機關而"},{"paragraph_number":"第3項","summary":"稱公文書者，謂公務員職務上製作之文書。"},{"paragraph_number":"第4項","summary":"稱重傷者謂毀敗或嚴重減損視覺聽覺語能嗅能一肢以上機"},{"paragraph_number":"第5項","summary":"稱性交者謂以性器進入他人性器肛門或口鳳或以性器以外"},{"paragraph_number":"第6項","summary":"稱電磁紀錄者謂以電子磁氣光學或其他相類之方式所製成"},{"paragraph_number":"第7項","summary":"稱凌虐者，謂以非人道之方法加諸身體或精神上之痛苦。"}]},{"article_number":"第11條","summary":"總則之適用範疇","paragraphs":[{"paragraph_number":"第1項","summary":"本法總則於其他法律有刑罰或保安處分之規定者亦適用之"}]},{"article_number":"第12條","summary":"故意與過失","paragraphs":[{"paragraph_number":"第1項","summary":"行為非出於故意或過失者，不罰。"},{"paragraph_number":"第2項","summary":"過失行為之處罰，以有特別規定者為限。"}]},{"article_number":"第13條","summary":"故意之概念","paragraphs":[{"paragraph_number":"第1項","summary":"行為人對於構成犯罪之事實明知並有意使其發生者為故意"},{"paragraph_number":"第2項","summary":"行為人對於構成犯罪之事實預見其發生而其發生並不違背"}]},{"article_number":"第14條","summary":"過失之概念","paragraphs":[{"paragraph_number":"第1項","summary":"行為人按其情節應注意並能注意而不注意者為過失"},{"paragraph_number":"第2項","summary":"行為人對於構成犯罪之事實預見其能發生而確信其不發生"}]},{"article_number":"第15條","summary":"不作為犯","paragraphs":[{"paragraph_number":"第1項","summary":"對於犯罪結果之發生法律上有防止之義務能防止而不防止"},{"paragraph_number":"第2項","summary":"因自己行為致有發生犯罪結果之危險者負防止其發生之義"}]},{"article_number":"第16條","summary":"違法性錯誤","paragraphs":[{"paragraph_number":"第1項","summary":"除有正當理由而無法避免者外不得因不知法律而免除刑事"}]},{"article_number":"第17條","summary":"加重結果犯","paragraphs":[{"paragraph_number":"第1項","summary":"因犯罪致發生一定之結果而有加重其刑之規定者如行為人"}]},{"article_number":"第18條","summary":"未成年人責任能力","paragraphs":[{"paragraph_number":"第1項","summary":"未滿十四歲人之行為，不罰。"},{"paragraph_number":"第2項","summary":"十四歲以上未滿十八歲人之行為，得減輕其刑。"},{"paragraph_number":"第3項","summary":"滿八十歲人人之行為，得減輕其刑。"}]},{"article_number":"第19條","summary":"責任能力之要件與推定","paragraphs":[{"paragraph_number":"第1項","summary":"行為時因精神障礙或其他心智缺陷致不能辨識其行為違法"},{"paragraph_number":"第2項","summary":"前項原因致其辨識行為違法能力顯著減低者得減輕其刑"},{"paragraph_number":"第3項","summary":"前二項規定，於因故意或過失自行招致者，不適用之。"}]},{"article_number":"第20條","summary":"瘖啞人責任能力","paragraphs":[{"paragraph_number":"第1項","summary":"瘖啞人之行為，得減輕其刑。"}]},{"article_number":"第21條","summary":"依法令或上級命令之行為","paragraphs":[{"paragraph_number":"第1項","summary":"依法令之行為，不罰。"},{"paragraph_number":"第2項","summary":"依上級公務員命令之行為不罰但明知命令違法者不在此限"}]},{"article_number":"第22條","summary":"正當業務行為","paragraphs":[{"paragraph_number":"第1項","summary":"業務上之正當行為，不罰。"}]},{"article_number":"第23條","summary":"正當防衛","paragraphs":[{"paragraph_number":"第1項","summary":"對於現在不法之侵害而出於防衛自己或他人權利之行為不"}]},{"article_number":"第24條","summary":"緊急避難","paragraphs":[{"paragraph_number":"第1項","summary":"因避免自己或他人生命身體自由財產之急迫危險而出於不"},{"paragraph_number":"第2項","summary":"前項關於避免自己危險之規定於公務上或業務上有特別義"}]},{"article_number":"第25條","summary":"未遂犯","paragraphs":[{"paragraph_number":"第1項","summary":"已著手於犯罪行為之實行而不遂者，為未遂犯。"},{"paragraph_number":"第2項","summary":"未遂犯之處罰以有特別規定者為限並得按既遂犯之刑減輕"}]},{"article_number":"第26條","summary":"不能未遂","paragraphs":[{"paragraph_number":"第1項","summary":"行為不能發生犯罪之結果，又無危險者，不罰。"}]},{"article_number":"第27條","summary":"中止犯","paragraphs":[{"paragraph_number":"第1項","summary":"已著手於犯罪行為之實行而因己意中止或防止其結果之發"},{"paragraph_number":"第2項","summary":"正犯或共犯中之一人或數人因己意防止結果發生或盡力防"}]},{"article_number":"第28條","summary":"正犯","paragraphs":[{"paragraph_number":"第1項","summary":"二人以上共同實行犯罪之行為者，皆為正犯。"}]},{"article_number":"第29條","summary":"教唆犯","paragraphs":[{"paragraph_number":"第1項","summary":"教唆他人使之實行犯罪行為者，為教唆犯。"},{"paragraph_number":"第2項","summary":"教唆犯之處罰，依其所教唆之罪處罰之。"}]},{"article_number":"第30條","summary":"幫助犯","paragraphs":[{"paragraph_number":"第1項","summary":"幫助他人實行犯罪行為者為幫助犯雖他人不知幫助之情者"},{"paragraph_number":"第2項","summary":"幫助犯之處罰，得按正犯之刑減輕之。"}]},{"article_number":"第31條","summary":"正犯與共犯之身份關係","paragraphs":[{"paragraph_number":"第1項","summary":"因身分或其他特定關係成立之罪其無特定關係之人科以同"},{"paragraph_number":"第2項","summary":"因身分或其他特定關係致刑有重輕或免除者無特定關係人"}]},{"article_number":"第32條","summary":"刑之重輕種類","paragraphs":[{"paragraph_number":"第1項","summary":"刑分為主刑及從刑。"}]},{"article_number":"第33條","summary":"主刑之種類","paragraphs":[{"paragraph_number":"第1項","summary":"主刑種類：死刑、無期徒刑、有期徒刑、拘役、罰金。"}]},{"article_number":"第34條","summary":"從刑之種類","paragraphs":[{"paragraph_number":"第1項","summary":"從刑之種類如下：褫奪公權。"}]},{"article_number":"第35條","summary":"主刑之重輕標準","paragraphs":[{"paragraph_number":"第1項","summary":"主刑之重輕，依第三十三條規定之順序定之。"},{"paragraph_number":"第2項","summary":"同種之刑以最高度之刑較長或較多者為重最高度相等者以"}]},{"article_number":"第36條","summary":"褫奪公權之內容","paragraphs":[{"paragraph_number":"第1項","summary":"褫奪公權者褫奪為公務員之資格及為公職候選人之資格"}]},{"article_number":"第37條","summary":"褫奪公權之宣告","paragraphs":[{"paragraph_number":"第1項","summary":"宣告死刑或無期徒刑者，宣告褫奪公權終身。"},{"paragraph_number":"第2項","summary":"宣告一年以上有期徒刑依犯罪之性質認為有褫奪公權之必"},{"paragraph_number":"第3項","summary":"褫奪公權自裁判確定時發生效力。"},{"paragraph_number":"第4項","summary":"褫奪公權之期間，自主刑執行完畢或赦免之日起算。"}]},{"article_number":"第38條","summary":"沒收物之範圍","paragraphs":[{"paragraph_number":"第1項","summary":"違禁物，不問屬於犯罪行為人與否，沒收之。"},{"paragraph_number":"第2項","summary":"供犯罪所用犯罪預備之物或犯罪所生之物屬於犯罪行為人"},{"paragraph_number":"第3項","summary":"前項之物屬於犯罪行為人以外之自然人法人或非法人團體"}]},{"article_number":"第38-1條","summary":"犯罪所得之沒收","paragraphs":[{"paragraph_number":"第1項","summary":"犯罪所得屬於犯罪行為人者沒收之但有特別規定者依其規"},{"paragraph_number":"第2項","summary":"犯罪所得已實際合法發還被害人者不予宣告沒收或追徵"}]},{"article_number":"第38-2條","summary":"沒收之估算與過苛調節","paragraphs":[{"paragraph_number":"第1項","summary":"前條沒收之物或犯罪所得範圍欠缺或費用過巨者得估算之"},{"paragraph_number":"第2項","summary":"宣告沒收或追徵顯過苛者，裁判得不予宣告或變更之。"}]},{"article_number":"第38-3條","summary":"沒收權利之轉移","paragraphs":[{"paragraph_number":"第1項","summary":"第三十八條之物及第三十八條之一之犯罪所得因繼承或受"}]},{"article_number":"第39條","summary":"免刑沒收","paragraphs":[{"paragraph_number":"第1項","summary":"免除其刑者，仍得專科沒收。"}]},{"article_number":"第40條","summary":"沒收之宣告","paragraphs":[{"paragraph_number":"第1項","summary":"沒收，於裁判時併宣告之。"},{"paragraph_number":"第2項","summary":"違禁物或專科沒收之物，得單獨宣告沒收。"}]},{"article_number":"第40-2條","summary":"追徵與追繳之時效","paragraphs":[{"paragraph_number":"第1項","summary":"沒收、追徵之請求權，因十年間不行使而消滅。"}]},{"article_number":"第41條","summary":"易科罰金","paragraphs":[{"paragraph_number":"第1項","summary":"犯最重本刑為五年以下有期徒刑以下之刑之罪而受六月以"},{"paragraph_number":"第2項","summary":"易科罰金之折算標準及條件，依第一項規定執行。"}]},{"article_number":"第42條","summary":"易服勞役","paragraphs":[{"paragraph_number":"第1項","summary":"罰金應於裁判確定後二個月內完納期滿不完納者強制執行"},{"paragraph_number":"第2項","summary":"易服勞役以新臺幣一千元二千元或三千元折算一日但勞役"}]},{"article_number":"第42-1條","summary":"易服社會服務","paragraphs":[{"paragraph_number":"第1項","summary":"罰金易服勞役，得依受刑人之聲請，易服社會服務。"}]},{"article_number":"第43條","summary":"易以訓誡","paragraphs":[{"paragraph_number":"第1項","summary":"受拘役或罰金之宣告而犯罪情節輕微顯可憫恕者得易以訓"}]},{"article_number":"第44條","summary":"易刑處分之效力","paragraphs":[{"paragraph_number":"第1項","summary":"易科罰金易服勞役或易以訓誡執行完畢者其所宣告之刑以"}]},{"article_number":"第46條","summary":"羈押日數折抵加算","paragraphs":[{"paragraph_number":"第1項","summary":"裁判確定前羈押之日數以一日抵有期徒刑或拘役一日或抵"}]},{"article_number":"第47條","summary":"累犯","paragraphs":[{"paragraph_number":"第1項","summary":"受徒刑之執行完畢或一部之執行而赦免後五年以內故意再"}]},{"article_number":"第48條","summary":"累犯更定其刑","paragraphs":[{"paragraph_number":"第1項","summary":"裁判確定後始發覺為累犯者依前條之規定更定其刑但刑之"}]},{"article_number":"第49條","summary":"累犯之例外","paragraphs":[{"paragraph_number":"第1項","summary":"累犯之規定，於前案依軍法審判者，不適用之。"}]},{"article_number":"第50條","summary":"數罪併罰之限制","paragraphs":[{"paragraph_number":"第1項","summary":"裁判確定前犯數罪者併合處罰之但有特別規定者不在此限"}]},{"article_number":"第51條","summary":"數罪併罰定應執行刑","paragraphs":[{"paragraph_number":"第1項","summary":"宣告多數有期徒刑者於各刑中加重之刑以上各刑合併之刑"}]},{"article_number":"第52條","summary":"數罪併罰案件之獨立裁判","paragraphs":[{"paragraph_number":"第1項","summary":"數罪併罰，分別宣告其罪之刑。"}]},{"article_number":"第53條","summary":"數罪併罰更定應執行刑","paragraphs":[{"paragraph_number":"第1項","summary":"數罪併罰有二以上之裁判者依第五十一條之規定定其應執"}]},{"article_number":"第54條","summary":"數罪併罰執行中赦免","paragraphs":[{"paragraph_number":"第1項","summary":"數罪併罰宣告之數刑，均經赦免者，免其執行。"}]},{"article_number":"第55條","summary":"想像競合犯","paragraphs":[{"paragraph_number":"第1項","summary":"一行為而觸犯數罪名者從一重處斷但不得輕於主管罪名之"}]},{"article_number":"第57條","summary":"科刑輕重應審酌事項","paragraphs":[{"paragraph_number":"第1項","summary":"科刑時應以行為人之責任為基礎並審酌一切情狀尤應注意"}]},{"article_number":"第58條","summary":"罰金加重減輕之標準","paragraphs":[{"paragraph_number":"第1項","summary":"科罰金時應審酌行為人之資力及因犯罪所得之利益如所得"}]},{"article_number":"第59條","summary":"酌量減輕","paragraphs":[{"paragraph_number":"第1項","summary":"犯罪情狀顯可憫恕認科以最低本刑仍嫌過重者得酌量減輕"}]},{"article_number":"第60條","summary":"酌量減輕併加重減輕","paragraphs":[{"paragraph_number":"第1項","summary":"依前條酌量減輕其刑者文章得同時有法律加重或減輕之原"}]},{"article_number":"第61條","summary":"免除其刑之標準","paragraphs":[{"paragraph_number":"第1項","summary":"犯特定輕微犯罪情節輕微顯可憫恕認為依第五十九條條減"}]},{"article_number":"第62條","summary":"自首","paragraphs":[{"paragraph_number":"第1項","summary":"對於未發覺之罪自首而受裁判者得減輕其刑但有特別規定"}]},{"article_number":"第63條","summary":"未成年人及老齡人之刑罰限制","paragraphs":[{"paragraph_number":"第1項","summary":"未滿十八歲人或滿八十歲人犯罪者不得處死刑或無期徒刑"}]},{"article_number":"第64條","summary":"死刑加重減輕之限制","paragraphs":[{"paragraph_number":"第1項","summary":"死刑不得加重。"},{"paragraph_number":"第2項","summary":"死刑減輕者，為無期徒刑。"}]},{"article_number":"第65條","summary":"無期徒刑加重減輕之限制","paragraphs":[{"paragraph_number":"第1項","summary":"無期徒刑不得加重。"},{"paragraph_number":"第2項","summary":"無期徒刑減輕者，為三十年以下十五年以上有期徒刑。"}]},{"article_number":"第66條","summary":"有期徒刑加重減輕之標準","paragraphs":[{"paragraph_number":"第1項","summary":"有期徒刑、拘役、罰金減輕者，減輕其刑至二分之一。"}]},{"article_number":"第67條","summary":"罰金加重減輕之標準","paragraphs":[{"paragraph_number":"第1項","summary":"有期徒刑或罰金加重或減輕者其最高度及最低度同加重或"}]},{"article_number":"第68條","summary":"拘役加重減輕之標準","paragraphs":[{"paragraph_number":"第1項","summary":"拘役加重或減輕者，僅加重或減輕其最高度。"}]},{"article_number":"第69條","summary":"數種主刑加重減輕順序","paragraphs":[{"paragraph_number":"第1項","summary":"數種主刑併加重或減輕者，先加重或減輕其較重者。"}]},{"article_number":"第70條","summary":"遞加遞減","paragraphs":[{"paragraph_number":"第1項","summary":"有二種以上刑之加重或減輕事由者，遞加或遞減之。"}]},{"article_number":"第71條","summary":"加減順序","paragraphs":[{"paragraph_number":"第1項","summary":"刑有加重及減輕者，先加後減。"}]},{"article_number":"第72條","summary":"零星日數折算及免除","paragraphs":[{"paragraph_number":"第1項","summary":"酌量減輕或加重致有未滿一日之零星日數者，不予計算。"}]},{"article_number":"第73條","summary":"罰金加減尾數計算","paragraphs":[{"paragraph_number":"第1項","summary":"罰金加重或減輕者，未滿一元之尾數不計。"}]},{"article_number":"第74條","summary":"緩刑要件","paragraphs":[{"paragraph_number":"第1項","summary":"受二年以下有期徒刑拘役或罰金之宣告而未曾受有期徒刑"}]},{"article_number":"第75條","summary":"撤銷緩刑","paragraphs":[{"paragraph_number":"第1項","summary":"受緩刑之宣告於緩刑期內故意再犯罪受有期徒刑以上刑之"}]},{"article_number":"第75-1條","summary":"緩刑之得撤銷","paragraphs":[{"paragraph_number":"第1項","summary":"受緩刑宣告於緩刑期內故意犯他罪受六月以下有期徒刑拘"}]},{"article_number":"第76條","summary":"緩刑之效力","paragraphs":[{"paragraph_number":"第1項","summary":"緩刑期滿而緩刑之宣告未經撤銷者其刑之宣告失其效力"}]},{"article_number":"第77條","summary":"假釋要件","paragraphs":[{"paragraph_number":"第1項","summary":"受徒刑之執行而有悛悔實據者無期徒刑逾二十五年有期徒"}]},{"article_number":"第78條","summary":"假釋之撤銷","paragraphs":[{"paragraph_number":"第1項","summary":"假釋中因故意更犯罪受有期徒刑以上刑之宣告者撤銷其假"}]},{"article_number":"第79條","summary":"假釋之效力","paragraphs":[{"paragraph_number":"第1項","summary":"在假釋期滿未經撤銷假釋者其未執行之刑以已執行論"}]},{"article_number":"第79-1條","summary":"合併執行與假釋","paragraphs":[{"paragraph_number":"第1項","summary":"二以上徒刑併執行者，刑期合併計算，定其假釋條件。"}]},{"article_number":"第80條","summary":"追訴權消滅時效","paragraphs":[{"paragraph_number":"第1項","summary":"追訴權因最重本刑死刑無期三十年七年以上二十年三年以"}]},{"article_number":"第81條","summary":"追訴權時效起算","paragraphs":[{"paragraph_number":"第1項","summary":"追訴權時效自犯罪成立之日起算但犯罪行為有連續或繼續"}]},{"article_number":"第82條","summary":"追訴權時效停止","paragraphs":[{"paragraph_number":"第1項","summary":"追訴權之時效因起訴依法停止偵查程序或通緝等事由而停"}]},{"article_number":"第83條","summary":"追訴權時效停止之限制","paragraphs":[{"paragraph_number":"第1項","summary":"追訴權時效停止原因繼續存在致達第八十條第一項各款期"}  if(T.end)T.timer=setInterval(tick,500);nextPage()};
function tick(){const r=T.end-Date.now();if(r<=0){clearInterval(T.timer);if(!T.graded&&T.page.length)grade();finish()}else if($('#tm'))$('#tm').textContent='⏱ '+Math.floor(r/6e4)+':'+String(Math.ceil(r/1e3)%60).padStart(2,'0')}
function nextPage(){if(T.asked>=T.tot)return finish();const n=Math.min(T.per,T.tot-T.asked);T.page=[];
 for(let i=0;i<n;i++){if(!T.queue.length){if(T.tot>=1e9)T.queue=sh(T.P);else break}const u=T.queue.shift();T.page.push(mkQ(u,T.mode==3?1+(Math.random()<.5):T.mode,T.P))}
 if(!T.page.length)return finish();T.asked+=T.page.length;T.graded=false;T.selItem=null;
 if(T.ui=='d'){const items=[];T.page.forEach(q=>items.push({t:q.ans}));T.page.forEach(q=>q.ex.forEach(t=>items.length<T.page.length+2&&items.push({t})));T.items=sh(items).map((x,i)=>({...x,id:i}));T.page.forEach(q=>q.placed=null)}
 render()}
function render(){const g=T.graded,H=[`<div class="hd"><b>已出 ${T.asked}${T.tot<1e9?' / '+T.tot:''} 題　答對 ${T.right}</b><span><span id="tm"></span> <button class="sm" id="back">結束返回</button></span></div>`];
 T.page.forEach((q,i)=>{const no=T.asked-T.page.length+i+1;let h=T.ui=='d'?`<div class="gc"><div class="gq"><span class="tag">${no}. ${D().cats[q.u.c]}</span><div>${q.q}</div></div>`:`<div class="q"><span class="no">第 ${no} 題</span><span class="tag">${D().cats[q.u.c]}</span><div class="qt">${q.q}</div>`;
  if(T.ui=='c')h+=q.opts.map((o,j)=>`<button class="o ${g?(o==q.ans?'ok':(o==q.pick?'no':'')):(o==q.pick?'sel':'')}" data-q="${i}" data-j="${j}">${o}</button>`).join('');
  else{const it=q.placed!=null?T.items[q.placed]:null;h+=`<div class="zone ${it?'has':''} ${g?(it&&it.t==q.ans?'ok':'no'):''}" data-z="${i}">${it?`<span class="it" data-p="${i}">${it.t}</span>`:'拖曳答案到此'}</div>`}
  if(g){const p=T.ui=='c'?q.pick:(q.placed!=null?T.items[q.placed].t:null);h+=p==q.ans?'<div class="fb good">✔ 正確</div>':`<div class="fb bad">✘ ${p?'錯誤':'未作答'}　正確答案：<b>${q.ans}</b></div>`;if(q.m==1)h+=`<div class="muted">條文：${q.u.r}　${q.u.t}</div>`}
  H.push(h+'</div>')});
 if(T.ui=='d'){H.splice(1,0,'<div class="grid">');H.push('</div>')}
 if(T.ui=='d'&&!g)H.push('<div class="bank" id="bk">'+T.items.filter(x=>!T.page.some(q=>q.placed===x.id)).map(x=>`<span class="it ${T.selItem===x.id?'sel':''}" draggable="true" data-b="${x.id}">${x.t}</span>`).join('')+'</div>');
 H.push(g?`<div class="row"><button class="btn" id="nx">${T.asked>=T.tot?'查看結果':'下一頁'}</button></div>`:`<div class="row"><button class="btn" id="sb" ${T.ui=='c'&&T.per>1?'':''}>送出本頁</button></div>`);
 $('#view').innerHTML=H.join('');tick()}
function grade(){T.graded=true;T.page.forEach(q=>{const p=T.ui=='c'?q.pick:(q.placed!=null?T.items[q.placed].t:null);if(p===q.ans)T.right++;else T.wrong.push(q)})}
$('#view').onclick=e=>{const t=e.target;if(!T)return;
 if(t.id=='back'){if(confirm('確定結束並返回選單？'))exit();return}
 if(t.id=='sb'){grade();render();return}
 if(t.id=='nx'){nextPage();return}
 if(t.id=='rs'||t.id=='ex'){exit();return}
 if(T.graded||T.done)return;
 const o=t.closest('.o');if(o){const q=T.page[o.dataset.q];q.pick=q.opts[o.dataset.j];if(T.per==1){grade()}render();return}
 const b=t.closest('[data-b]');if(b){T.selItem=T.selItem==+b.dataset.b?null:+b.dataset.b;render();return}
 const p=t.closest('[data-p]');if(p){T.page[p.dataset.p].placed=null;render();return}
 const z=t.closest('[data-z]');if(z&&T.selItem!=null)put(+z.dataset.z,T.selItem)};
function put(i,id){T.page.forEach(q=>{if(q.placed===id)q.placed=null});T.page[i].placed=id;T.selItem=null;render()}
$('#view').addEventListener('dragstart',e=>{const b=e.target.closest('[data-b]');if(b)e.dataTransfer.setData('text/plain',b.dataset.b)});
$('#view').addEventListener('dragover',e=>{if(e.target.closest('[data-z]'))e.preventDefault()});
$('#view').addEventListener('drop',e=>{const z=e.target.closest('[data-z]');if(!z||!T||T.graded)return;e.preventDefault();put(+z.dataset.z,+e.dataTransfer.getData('text/plain'))});
function finish(){clearInterval(T.timer);T.done=true;const n=T.right+T.wrong.length,r=n?Math.round(T.right/n*100):0;
 $('#view').innerHTML=`<h3>測驗結果</h3><div class="big">${r}%　<span class="muted">答對 ${T.right} / ${n} 題，錯誤率 ${100-r}%</span></div><div class="bar"><i style="width:${r}%"></i></div>
 ${T.wrong.length?'<h3>答錯的題目與正確答案</h3>'+T.wrong.map(q=>`<div class="q"><div class="qt">${q.q}</div><div class="fb good">正確答案：<b>${q.ans}</b></div>${q.m==1?`<div class="muted">${q.u.r}　${q.u.t}</div>`:`<div class="muted">${q.u.r}</div>`}</div>`).join(''):'<p class="good">🎉 全部答對！</p>'}
 <div class="row"><button class="btn" id="rs">返回選單</button></div>`}
function exit(){clearInterval(T&&T.timer);T=null;P2=null;$('#view').hidden=true;$('#setup').hidden=$('#load').hidden=false}
let P2=null;
$('#prac').onclick=()=>{const P=pool();if(!P.length)return alert('請先選擇科目');P2={l:$('#ord').value=='r'?sh(P):P,pg:0,n:10};$('#setup').hidden=$('#load').hidden=true;$('#view').hidden=false;prac()};
function prac(){const{l,pg,n}=P2,tp=Math.ceil(l.length/n);$('#view').innerHTML=`<div class="hd"><b>練習（共 ${l.length} 條，第 ${pg+1}/${tp} 頁）</b><button class="sm" id="ex">返回選單</button></div>`+l.slice(pg*n,pg*n+n).map(u=>`<div class="pr"><b>${u.r}</b><span>${ct(u)}</span></div>`).join('')+`<div class="row"><button id="pv" ${pg?'':'disabled'}>上一頁</button><button id="pn" ${pg<tp-1?'':'disabled'}>下一頁</button></div>`}
document.addEventListener('click',e=>{if(!P2||T)return;if(e.target.id=='pv'){P2.pg--;prac()}if(e.target.id=='pn'){P2.pg++;prac()}if(e.target.id=='ex')exit()});
$('#view').addEventListener('click',e=>{if(P2&&e.target.id=='ex')exit()});
setup();
</script></body></html>
